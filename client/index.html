<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2318181b'/%3E%3Cpath d='M7 11 L14 16 L7 21' fill='none' stroke='%23007acc' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='16' y1='21' x2='25' y2='21' stroke='%2322c55e' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatAbit — Real-Time Developer & AI Chat</title>
    <meta name="description" content="Fast, developer-first real-time chat with syntax highlighting, slash commands, SQLite persistence, and Senior AI DevBot assistant." />
    <!-- Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('chitabit_theme') || 'dark-plus';
          document.documentElement.setAttribute('data-theme', savedTheme);
          if (savedTheme === 'light-plus' || savedTheme === 'github-light' || savedTheme === 'solarized-light') {
            document.documentElement.classList.add('light-plus');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light-plus');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] font-sans antialiased selection:bg-[var(--selection)] selection:text-white transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
